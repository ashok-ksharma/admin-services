# Unit tests must be self-contained: they run in CI with no config server, so this URI is
# deliberately unreachable and health.config.enabled=false below stops the client retrying.
# Do NOT point this at a live config server - remote property sources outrank local ones and
# would silently change what the tests exercise.
spring.cloud.config.uri=localhost
spring.cloud.config.label=master
spring.cloud.config.name=admin
spring.application.name=admin-service
spring.profiles.active=test
management.endpoints.web.exposure.include=refresh,health
#management.security.enabled=false
# Mirrors src/main/resources/bootstrap.properties. This file shadows the main one on the
# test classpath, so the settings below have to be repeated here for the tests to exercise
# the real actuator and springdoc routing.
management.endpoints.web.base-path=/v1/admin/actuator

server.port=8098
server.servlet.context-path=/r2/v1/admin

#disabling health check so that client doesnt try to load properties from sprint config server every
# 5 minutes (should not be done in production)
health.config.enabled=false
mosip.admin.globalproperty.prefix=globalMessages_
mosip.admin.globalproperty.suffix=.properties
#Swagger 3.0 open api
openapi.info.title=Admin Service
openapi.info.description=Admin Service for CRUD
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
mosipbox.public.url=http://localhost:${server.port}
openapi.service.servers[0].url=${mosipbox.public.url}${server.servlet.context-path}
openapi.service.servers[0].description=Admin Masterdata url
openapi.group.name=${openapi.info.title}
openapi.group.paths[0]=/v1/admin/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/v1/admin/swagger-ui.html
springdoc.api-docs.path=/v1/admin/v3/api-docs
spring.mvc.servlet.path=${server.servlet.context-path}