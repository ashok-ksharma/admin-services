spring.cloud.config.uri=http://localhost:51000/config
spring.cloud.config.label=master
spring.cloud.config.name=admin
spring.application.name=admin-service
spring.profiles.active=dev
#management.security.enabled=false
#management.endpoint.health.show-details=when-authorized
#management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=info,health,refresh
# Actuator is served by WebMvcEndpointHandlerMapping, a separate handler mapping that
# ApiPathPrefixConfig cannot reach, so it needs its own copy of the /v1/admin prefix that
# server.servlet.context-path used to supply. The Helm liveness/readiness probes, the
# Prometheus scrape path and Istio routing all depend on /v1/admin/actuator/health.
management.endpoints.web.base-path=/v1/admin/actuator

#javax.persistence.jdbc.url=jdbc:postgresql://104.211.208.136:9001/mosip_master
#javax.persistence.jdbc.user=masteruser
#javax.persistence.jdbc.password=Mosip@dev123
#javax.persistence.jdbc.driver=org.postgresql.Driver

server.port=8098
# No server.servlet.context-path: one Spring Boot app has exactly one context-path, but the
# merged application serves four prefixes. ApiPathPrefixConfig re-applies /v1/admin (and,
# in later steps, /v1/masterdata, /v1/syncdata, /v1/hotlist) per controller package instead.

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
#javax.persistence.jdbc.url=${masterdata_database_url}
#javax.persistence.jdbc.user=${masterdata_database_username}
#javax.persistence.jdbc.password=${masterdata_database_password}

#disabling health check so that client doesnt try to load properties from sprint config server every
# 5 minutes (should not be done in production)
health.config.enabled=false
#auth.server.validate.url=https://dev.mosip.io/v1/authmanager/authorize/validateToken

#To read the property file by the name
mosip.admin.globalproperty.prefix=globalMessages
mosip.admin.globalproperty.suffix=.properties
mosip.admin-services.required.roles=GLOBAL_ADMIN
#Swagger 3.0 open api
openapi.info.title=Admin Service
openapi.info.description=Admin Service for CRUD
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
mosipbox.public.url=http://localhost:${server.port}
# MUST stay the bare origin. Pre-merge this was ${mosipbox.public.url}${server.servlet.context-path}
# because the mapped paths were bare (/roles) and the context-path supplied the prefix.
# ApiPathPrefixConfig now bakes /v1/admin into the mappings themselves, so the documented
# operation paths already read /v1/admin/roles. Adding /v1/admin here as well makes Swagger
# UI issue http://host/v1/admin/v1/admin/roles.
openapi.service.servers[0].url=${mosipbox.public.url}
openapi.service.servers[0].description=Admin Service url
openapi.group.name=${openapi.info.title}
# Scoped to this service's prefix (was /**) so the group keeps documenting only
# admin-service's operations once the other three services share the same application.
openapi.group.paths[0]=/v1/admin/**

# springdoc's controllers live in org.springdoc.*, which ApiPathPrefixConfig deliberately
# does not prefix, so without these the documentation falls back to the server root. Both
# paths are absolute so the UI and api-docs stay where they were before the merge:
#   /v1/admin/swagger-ui/index.html  and  /v1/admin/v3/api-docs
# springdoc derives the swagger-ui resource root from everything before the last '/' in
# springdoc.swagger-ui.path, which is what moves the UI assets under /v1/admin too.
springdoc.swagger-ui.path=/v1/admin/swagger-ui.html
springdoc.api-docs.path=/v1/admin/v3/api-docs
