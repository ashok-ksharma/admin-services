# Dependencies for admin-service. The app itself runs on the host (IDE or jar) on port 8086
# with -Dspring.profiles.active=default,local -Dspring.cloud.config.uri=http://localhost:51200/config
name: admin-local

services:

  postgres:
    image: 'postgres:18.6-bookworm'
    container_name: admin_local_postgres
    ports:
      - "5456:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mosip123
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../../db_scripts:/db_scripts:ro
      - ./keymanager:/keymanager:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosip_master"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Serves ./mosip-config: verbatim *-default copies plus the admin-local overlay.
  # Host port 51200; the app is pointed at it with -Dspring.cloud.config.uri.
  config-server:
    image: mosipid/kernel-config-server:1.3.1
    container_name: admin_local_config_server
    ports:
      - "51200:51000"
    volumes:
      - ./mosip-config:/mosip-config:ro
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/mosip-config
      - SPRING_CLOUD_CONFIG_SERVER_ACCEPT_EMPTY=true
      - SPRING_CLOUD_CONFIG_SERVER_GIT_FORCE_PULL=false
      - SPRING_CLOUD_CONFIG_SERVER_GIT_CLONEONSTART=false
      - SPRING_CLOUD_CONFIG_SERVER_GIT_REFRESHRATE=0
      - SERVER_PORT=51000
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
      - SPRING_SECURITY_ENABLED=false
    healthcheck:
      # actuator/health returns 404 in this image; the config endpoint proves it is ready.
      test: ["CMD-SHELL", "curl -f http://localhost:51000/config/admin/default,local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Stands in for Keycloak/authmanager (generated keycloak-authmanager.json) and every
  # other external service except keymanager (hand-written admin-services.json).
  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: admin_local_wiremock
    ports:
      - "8083:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--max-request-journal-entries", "1000"]
    # api-test-rig.json proxies /v1/masterdata and /v1/admin to the app on the host (port 8086).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot: the image has no /home/mosip/keys, so a new volume is owned by root. Hand it to the
  # mosip user (uid 1001) that keymanager runs as; exits straight away.
  keymanager-keys-init:
    image: mosipid/kernel-keymanager-service:1.4.1
    container_name: admin_local_keymanager_keys_init
    user: root
    entrypoint: ["chown", "1001:1001", "/home/mosip/keys"]
    volumes:
      - keymanager-keys:/home/mosip/keys

  # Real keymanager, PKCS12 instead of SoftHSM (keystore in the keymanager-keys volume).
  # bootstrap.sh starts it without the auth adapter and creates ROOT, KERNEL, KERNEL:SIGN on first start.
  keymanager:
    image: mosipid/kernel-keymanager-service:1.4.1
    container_name: admin_local_keymanager
    ports:
      - "8089:8088"
    volumes:
      - ./keymanager:/bootstrap:ro
      - keymanager-keys:/home/mosip/keys
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    depends_on:
      keymanager-keys-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/.km-ready && curl -fs http://localhost:8088/v1/keymanager/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot: loads the sample test data in ./mosip-data/xlsx into mosip_master (truncate + insert per table).
  # Run by run-local-stack.sh / .bat on a fresh database only; not started by a plain "docker compose up".
  masterdata-loader:
    image: mosipid/masterdata-loader:1.3.1
    container_name: admin_local_masterdata_loader
    profiles: ["seed"]
    volumes:
      - ./mosip-data/xlsx:/data/xlsx:ro
    working_dir: /home/mosip/lib
    entrypoint: ["python", "upload_masterdata.py", "postgres", "mosip123", "admin", "/data/xlsx",
                 "--db_user=masteruser", "--db_port=5432", "--tables_file", "table_order"]
    depends_on:
      postgres:
        condition: service_healthy

# The database and the keystore belong together: both are kept by up / down / restart and
# removed together only by "down -v" (run-local-stack wipe).
volumes:
  postgres-data:
  keymanager-keys:
