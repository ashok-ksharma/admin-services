# Local overlay for the host-run admin-service (profiles default,local).
# The config server serves this file on top of admin-default / application-default,
# so the *-default files stay verbatim copies of mosip-config.
#
# Host ports (docker compose, see ../docker-compose.yml):
#   postgres 5456 | config-server 51200 | WireMock 8083 | keymanager 8089 | app 8086

# --- Values a cluster injects from secrets / env ------------------------------
mosip.api.internal.host=localhost
mosip.api.public.host=localhost
mosip.admin.host=localhost
db.dbuser.password=mosip123
mosip.admin.client.secret=local-secret
mosip.regproc.client.secret=local-secret

# Without this, Spring Cloud LoadBalancer treats "localhost" in the auth adapter's
# self-token / REST clients as a service id and the call fails ("No servers available").
spring.cloud.loadbalancer.enabled=false

# --- Database (compose postgres) ----------------------------------------------
mosip.database.hostname.override=localhost
mosip.database.port.override=5456

# --- Remote services ----------------------------------------------------------
# WireMock stands in for every external service except keymanager.
mosip.api.internal.url=http://localhost:8083
mosip.api.public.url=http://localhost:8083
keycloak.external.url=http://localhost:8083
keycloak.internal.url=http://localhost:8083
mosip.kernel.authmanager.url=http://localhost:8083
mosip.kernel.auditmanager.url=http://localhost:8083
mosip.idrepo.identity.url=http://localhost:8083
mosip.regproc.status.service.url=http://localhost:8083
mosip.regproc.transaction.service.url=http://localhost:8083
mosip.packet.receiver.url=http://localhost:8083
mosip.websub.url=http://localhost:8083
mosip.digitalcard.service.url=http://localhost:8083

# Real keymanager container.
mosip.kernel.keymanager.url=http://localhost:8089
mosip.admin.keymanager.service.url=http://localhost:8089/v1
