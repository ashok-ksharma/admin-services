# Local overlay for the keymanager container (profiles default,local; config name keymanager,kernel).
# The config server serves this file on top of kernel-default / application-default.

# Values a cluster injects from secrets / env.
mosip.api.internal.host=localhost
mosip.api.public.host=localhost
db.dbuser.password=mosip123
mosip.kernel.tokenid.uin.salt=local-uin-salt-not-for-production
mosip.kernel.tokenid.partnercode.salt=local-partnercode-salt-not-for-production

# PKCS12 file instead of SoftHSM; bootstrap.sh creates the keys in it on first start.
mosip.kernel.keymanager.hsm.keystore-type=PKCS12
mosip.kernel.keymanager.hsm.config-path=/home/mosip/keys/admin-local-ks.p12
mosip.kernel.keymanager.hsm.keystore-pass=mosip123

# Compose postgres (service name inside the compose network).
keymanager_database_url=jdbc:postgresql://postgres:5432/mosip_keymgr
keymanager_database_username=keymgruser
keymanager_database_password=mosip123

spring.cloud.loadbalancer.enabled=false

# The container runs without the auth adapter (see bootstrap.sh); without this, Spring Boot's
# default security puts every API behind HTTP Basic auth.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
