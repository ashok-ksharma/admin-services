# Tokens served by the local WireMock IAM (no Keycloak).
# Regenerate after any change here:  java tools/jwt/GenerateTokens.java   (run from local-dev-setup/)
#
# Common settings
issuer=http://localhost:8083/auth/realms/mosip
kid=local-admin-iam-sig
validity.years=100

# Every token is token.<name>.<field>:
#   type      client = service-account token (clientidsecretkey / OIDC token endpoint, matched on clientId)
#             user   = user login token (authenticate/useridPwd and internal/useridPwd, matched on userName)
#   clientId  azp / aud of the token (and the match key for type=client)
#   username  preferred_username (and the match key for type=user)
#   roles     realm_access.roles, comma separated
#
# To add a token for a new role or user: add a block below and rerun the generator.

# Service account admin-service uses for its own outbound calls (self-token).
# Holds the keymanager roles (sign/decrypt/encrypt) and the WebSub publish roles.
token.admin-client.type=client
token.admin-client.clientId=mosip-admin-client
token.admin-client.roles=GLOBAL_ADMIN,ZONAL_ADMIN,MASTERDATA_ADMIN,REGISTRATION_ADMIN,KEY_MAKER,\
  PUBLISH_MASTERDATA_IDAUTHENTICATION_TEMPLATES_GENERAL,PUBLISH_MASTERDATA_TITLES_GENERAL,PUBLISH_MOSIP_HOTLIST_GENERAL,\
  default-roles-mosip,offline_access,uma_authorization

# api-test role "admin": user <module>-<admin_userName> = masterdata-220005 (roles.220005 in the rig's Kernel.properties).
token.masterdata-220005.type=user
token.masterdata-220005.clientId=mosip-admin-client
token.masterdata-220005.username=masterdata-220005
token.masterdata-220005.roles=GLOBAL_ADMIN,ID_AUTHENTICATION,REGISTRATION_ADMIN,REGISTRATION_SUPERVISOR,ZONAL_ADMIN,\
  default-roles-mosip,offline_access,uma_authorization

# api-test role "globalAdmin": user admin_zone_userName = globaladmin (roles.globaladmin in the rig's Kernel.properties).
token.globaladmin.type=user
token.globaladmin.clientId=mosip-admin-client
token.globaladmin.username=globaladmin
token.globaladmin.roles=GLOBAL_ADMIN,REGISTRATION_ADMIN,ZONAL_ADMIN,default-roles-mosip,offline_access,uma_authorization

# api-test rig's Keycloak admin client (KeycloakUserManager, client_credentials). Only needs a token;
# the user create / search calls it makes are stubbed in api-test-rig.json.
token.testrig-client.type=client
token.testrig-client.clientId=mosip-testrig-client
token.testrig-client.roles=default-roles-mosip,offline_access,uma_authorization
